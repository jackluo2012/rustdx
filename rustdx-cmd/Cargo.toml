[package]
name        = "rustdx-cli"
version     = "1.3.0"
edition     = "2024"
license     = "MIT"
build       = "build.rs"
readme      = "../README.md"
description = "受 pytdx 启发的 A 股数据获取命令行工具：解析通达信 day 文件、东方财富日线增量、ClickHouse 写入"
repository  = "https://github.com/jackluo2012/rustdx"
authors     = ["zjp <jiping_zhou@foxmail.com>"]
exclude     = [
                "assets", "examples", "benches", "tests", "rustdx.log", "*.csv",
                "LICENSE-MIT", "rustfmt.toml"
              ]

[dependencies]
eyre = "0.6"
argh = "0.1"
csv  = "1.4"
calamine = "0.36"
serde_json = "1"
env_logger = "0.11"

log = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

[dependencies.rustdx-complete]
version  = "1.3.0"
path = "../"

[dependencies.ureq]
version = "3"
default-features = false
features = ["rustls"]

[dependencies.zip]
version = "2"
default-features = false
features = ["deflate"]

[[bin]]
name = "rustdx"
path = "src/main.rs"

