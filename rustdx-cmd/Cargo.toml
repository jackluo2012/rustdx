[package]
name        = "rustdx-cmd"
version     = "1.0.1"
edition     = "2024"
license     = "MIT"
build       = "build.rs"
readme      = "../README.md"
description = "受 pytdx 启发的 A 股数据获取库"
repository  = "https://github.com/jackluo2012/rustdx"
authors     = ["zjp <jiping_zhou@foxmail.com>"]
exclude     = [
                "assets", "examples", "benches", "tests", "rustdx.log", "*.csv",
                "LICENSE-MIT", "rustfmt.toml"
              ]

[dependencies]
eyre = "0.6"
argh = "0.1"
csv  = "1.4"
calamine = "0.36"
serde_json = "1"
env_logger = "0.11"

log = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

[dependencies.rustdx-complete]
version  = "1.0.1"
path = "../"

[dependencies.ureq]
version = "3"
default-features = false
features = ["rustls"]

[[bin]]
name = "rustdx"
path = "src/main.rs"

